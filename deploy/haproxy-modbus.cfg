global
    log stdout format raw local0 info
    maxconn 64
    maxconnrate 128
    nbthread 1

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 2s
    timeout client 5s
    timeout server 5s

frontend modbus_public
    bind :1502
    maxconn 64
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 8 }
    tcp-request connection reject if { sc_conn_rate(0) gt 20 }
    default_backend modbus_runtime

backend modbus_runtime
    server honeypot honeypot:1502 check send-proxy
